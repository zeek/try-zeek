name: web-ui tests

# Playwright end-to-end suite for the web UI. The backend is fully mocked
# (manager/web-ui/e2e/fixtures.js) and Playwright starts the app itself via its
# webServer config, so no Zeek backend is required. This suite is
# framework-agnostic and is the correctness oracle for the React -> Svelte
# migration. This also runs the regular unit tests for complete testing.

on:
  push:
    branches: [master]
    paths:
      - 'manager/web-ui/**'
      - '.github/workflows/web-ui.yml'
  pull_request:
    paths:
      - 'manager/web-ui/**'
      - '.github/workflows/web-ui.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: manager/web-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # 7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: manager/web-ui/package-lock.json

      # --legacy-peer-deps: pre-existing redux@5 / react-redux@8 peer conflict.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Jest tests
        run: npm run test

      # Playwright's webServer config builds/serves the app (npm start) and
      # tears it down when the run finishes.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # 7.0.1
        with:
          name: playwright-report
          path: manager/web-ui/playwright-report
          retention-days: 7
